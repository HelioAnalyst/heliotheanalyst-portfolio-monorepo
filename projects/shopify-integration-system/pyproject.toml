[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopify-integration-system"
version = "1.0.0"
description = "Enterprise-grade e-commerce synchronization platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HelioTheAnalyst", email = "hello@heliotheanalyst.co.uk"}
]
keywords = ["shopify", "integration", "e-commerce", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.7",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-redis",
]

[project.scripts]
shopify-integration = "shopify_integration.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shopify_integration"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
extend = "../../pyproject.toml"
asyncio_mode = "auto"
