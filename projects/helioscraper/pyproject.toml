[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helioscraper"
version = "1.0.0"
description = "Configurable web scraping framework with anti-detection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HelioTheAnalyst", email = "hello@heliotheanalyst.co.uk"}
]
keywords = ["web-scraping", "selenium", "data-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "selenium>=4.15.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.3",
    "pandas>=2.1.0",
    "jinja2>=3.1.2",
    "fake-useragent>=1.4.0",
    "webdriver-manager>=4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-pyyaml",
    "types-requests",
]

[project.scripts]
helioscraper = "helioscraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helioscraper"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
extend = "../../pyproject.toml"
