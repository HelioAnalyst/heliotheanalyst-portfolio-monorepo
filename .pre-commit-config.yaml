# HelioTheAnalyst Portfolio Monorepo - Pre-commit Configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_stages: [pre-commit]
minimum_pre_commit_version: "3.0.0"

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(data/|outputs/|.*\.csv)
      - id: end-of-file-fixer
        exclude: ^(data/|outputs/|.*\.csv)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python code formatting and linting (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^projects/.*/(src|tests)/.*\.py$
      - id: ruff-format
        files: ^projects/.*/(src|tests)/.*\.py$

  # Type checking (mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - types-requests
          - types-redis
          - types-python-dateutil
        args: [--ignore-missing-imports, --show-error-codes]
        files: ^projects/.*/src/.*\.py$
        exclude: ^projects/.*/(tests|scripts)/.*$

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^projects/.*/src/.*\.py$
        exclude: ^projects/.*/tests/.*$

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint-docker
        files: Dockerfile$
        entry: hadolint/hadolint:v2.12.1-beta hadolint

  # Shell script checking
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.sh$
        args: [-e, SC1091]

  # Local hooks for project-specific checks
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: bash -c 'cd projects/${PROJECT:-api-docs-testing-framework} && python -m pytest tests/ -q --tb=line 2>/dev/null || echo "Skipping pytest (venv not active)"'
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-push]
